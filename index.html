<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cromoesferas: Puzzle Zen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-wrapper">
        <header>
            <h1>Cromoesferas</h1>
            <p>Nivel <span id="level-indicator">1</span></p>
        </header>

        <main id="game-board">
            </main>

        <footer>
            <div class="controls">
                <button id="undo-btn" title="Deshacer último movimiento">Deshacer</button>
                <button id="restart-btn" title="Reiniciar nivel">Reiniciar</button>
                <button id="hint-btn" title="Mostrar una pista">Pista</button>
            </div>
            <div class="power-ups">
                <button id="add-tube-btn" title="Añadir un tubo vacío extra">
                    + Añadir Tubo
                </button>
            </div>
        </footer>
    </div>
    
    <div id="win-modal" class="hidden">
        <div class="modal-content">
            <h2>¡Nivel Completado!</h2>
            <p>Has encontrado la armonía de los colores.</p>
            <button id="next-level-btn">Siguiente Nivel</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
